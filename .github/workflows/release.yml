name: Release

# Push a tag "v<version>" (same version as custom_components/cel_ca/manifest.json)
# to publish a GitHub release; HACS then offers it as an update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the integration version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/cel_ca/manifest.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "CEL-CA $GITHUB_REF_NAME" --generate-notes --verify-tag
