reserve:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: cel_ca
    power_w:
      required: true
      example: 2000
      selector:
        number:
          min: 1
          max: 100000
          step: 10
          unit_of_measurement: W
          mode: box
    min_power_w:
      selector:
        number:
          min: 1
          max: 100000
          step: 10
          unit_of_measurement: W
          mode: box
    duration_min:
      default: 15
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min
    producer_id:
      example: hems-abcdefghijklmnopqrstuvwx
      selector:
        text:
    offer_id:
      selector:
        text:
    start:
      selector:
        datetime:
